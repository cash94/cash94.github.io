<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TorrStream — вход</title>
<!--
  Страница входа. Её отдаёт сервер на «/» вместо приложения, когда в админке
  включён вход по паролю, а устройство не вошло и не в домашней сети
  (routes/proxy.js, services/access.js). Вход — та же учётка, что во вкладке
  «Аккаунт»: сервер ставит cookie ts_auth, а здесь, как в js/account.js,
  запоминаются токен и clientId учётки — с ними приложение и откроется.

  Устройство, вошедшее в аккаунт ещё до включения входа, cookie не имеет, но
  токен у него есть: проверяем его (/api/account/me ставит cookie) и сразу
  открываем приложение.

  ES5 без зависимостей: телевизоры с Chrome 53–66. Пульт: стрелки — между
  полями, OK — ввод/вход.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
  body { font-family: Inter, "LG Smart UI", Roboto, Arial, sans-serif; }
  .wrap { position: absolute; top: 50%; left: 50%; width: 560px; margin-left: -280px;
    -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  h1 { font-size: 46px; margin: 0 0 6px; font-weight: 800; }
  h1 span { color: #ff8c00; }
  .sub { font-size: 20px; color: #9a9aa6; margin: 0 0 30px; }
  label { display: block; font-size: 17px; color: #9a9aa6; margin: 0 0 8px; }
  input { display: block; width: 100%; box-sizing: border-box; padding: 16px 20px; margin: 0 0 20px;
    font-size: 24px; font-family: inherit; background: #141419; color: #fff;
    border: 3px solid #24242c; border-radius: 14px; outline: none; }
  button { width: 100%; padding: 16px; font-size: 24px; font-weight: 700; font-family: inherit;
    border: 3px solid transparent; border-radius: 14px; background: #ff8c00; color: #000; cursor: pointer; outline: none; }
  button:disabled { opacity: 0.6; }
  .focus { border-color: #ff8c00 !important; }
  button.focus { border-color: #fff !important; }
  .msg { min-height: 28px; margin: 18px 0 0; font-size: 19px; color: #9a9aa6; }
  .msg.error { color: #ff6a6a; }
  .hint { margin-top: 26px; font-size: 16px; color: #5c5c66; line-height: 1.4; }
  @media (max-width: 640px) {
    .wrap { width: auto; left: 16px; right: 16px; margin-left: 0; }
    h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Torr<span>Stream</span></h1>
  <p class="sub">Сервер доступен только по логину и паролю</p>
  <form id="form" autocomplete="on" onsubmit="return false">
    <label for="login">Логин</label>
    <input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="password">Пароль</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="submit" type="submit">Войти</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="hint">Учётную запись создаёт администратор сервера.<br>Забыли пароль — его может сменить администратор или вы сами кодом восстановления во вкладке «Аккаунт» после входа.</p>
</div>
<script>
(function () {
  var LS_TOKEN = 'authToken', LS_LOGIN = 'authLogin', LS_DEVICE = 'deviceClientId';
  var KEYS = { UP: 38, DOWN: 40, OK: 13 };
  var loginEl = document.getElementById('login');
  var passEl = document.getElementById('password');
  var btn = document.getElementById('submit');
  var msgEl = document.getElementById('msg');
  var items = [loginEl, passEl, btn];
  var cur = 0;

  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

  function message(text, isError) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (isError ? ' error' : '');
  }

  function focusItem(i, native) {
    cur = Math.max(0, Math.min(items.length - 1, i));
    for (var k = 0; k < items.length; k++) items[k].className = items[k].className.replace(/\s*focus\b/g, '');
    items[cur].className += ' focus';
    // Настоящий фокус полю — по OK: иначе на телевизоре клавиатура выезжала
    // бы от одних стрелок
    if (native) { try { items[cur].focus(); } catch (e) { } }
    else if (document.activeElement && document.activeElement !== items[cur]) { try { document.activeElement.blur(); } catch (e) { } }
  }

  function request(method, path, body, token, done) {
    var x = new XMLHttpRequest();
    x.open(method, path, true);
    x.setRequestHeader('Content-Type', 'application/json');
    if (token) x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.onload = function () {
      var d = {};
      try { d = JSON.parse(x.responseText); } catch (e) { }
      d._status = x.status;
      done(d);
    };
    x.onerror = function () { done({ _status: 0 }); };
    x.send(body ? JSON.stringify(body) : null);
  }

  /** Как enterAccount в js/account.js: устройство работает под данными учётки */
  function enterAccount(d) {
    var current = ls('clientId');
    if (!ls(LS_DEVICE) && current && current !== d.dataId) lsSet(LS_DEVICE, current);
    lsSet(LS_TOKEN, d.token);
    lsSet(LS_LOGIN, d.login);
    if (d.dataId) lsSet('clientId', d.dataId);
  }

  function openApp() {
    message('Открываем TorrStream…');
    location.replace('/' + location.search);
  }

  function submit() {
    var login = loginEl.value.replace(/^\s+|\s+$/g, '');
    var password = passEl.value;
    if (!login || !password) { message('Введите логин и пароль', true); return; }
    btn.disabled = true;
    message('Входим…');
    request('POST', '/api/account/login', { login: login, password: password, clientId: ls('clientId') || undefined }, null, function (d) {
      btn.disabled = false;
      if (!d.success) {
        message(d._status === 0 ? 'Сервер недоступен' : (d.error || 'Не удалось войти'), true);
        return;
      }
      enterAccount(d);
      openApp();
    });
  }

  btn.onclick = submit;
  passEl.addEventListener('keydown', function (e) { if (e.keyCode === KEYS.OK) { e.preventDefault(); submit(); } });

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === KEYS.DOWN) { e.preventDefault(); focusItem(cur + 1); }
    else if (k === KEYS.UP) { e.preventDefault(); focusItem(cur - 1); }
    else if (k === KEYS.OK && document.activeElement !== items[cur]) {
      e.preventDefault();
      if (items[cur] === btn) submit(); else focusItem(cur, true);
    }
  });
  for (var i = 0; i < items.length; i++) {
    (function (idx) {
      items[idx].addEventListener('mouseover', function () { focusItem(idx); });
      items[idx].addEventListener('focus', function () { if (cur !== idx) focusItem(idx); });
    })(i);
  }

  // Уже входили в аккаунт до включения входа на сервер — проверяем токен:
  // действующий ставит cookie, и приложение сразу откроется
  var token = ls(LS_TOKEN);
  if (token) {
    message('Проверяем вход…');
    request('GET', '/api/account/me', null, token, function (d) {
      if (d.success) { if (d.dataId) lsSet('clientId', d.dataId); openApp(); return; }
      // Сессию закрыли — как выход в js/account.js: устройство возвращается
      // к своему clientId
      if (d._status === 401) {
        var dev = ls(LS_DEVICE);
        if (dev) { lsSet('clientId', dev); lsDel(LS_DEVICE); }
        lsDel(LS_TOKEN);
      }
      message('');
      if (ls(LS_LOGIN)) loginEl.value = ls(LS_LOGIN);
      focusItem(loginEl.value ? 1 : 0);
    });
  } else {
    focusItem(0);
  }
})();
</script>
</body>
</html>
