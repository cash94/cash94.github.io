<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нет подключения - TorrStream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000000;
      color: #e0e0e0;
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .offline-container {
      text-align: center;
      padding: 20px;
    }
    
    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #4a9eff;
    }
    
    p {
      margin-bottom: 20px;
      color: #aaa;
    }
    
    .retry-btn {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .retry-btn:hover {
      background: #3a7ecc;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>Нет подключения к интернету</h1>
    <p>Пожалуйста, проверьте ваше соединение</p>
    <button class="retry-btn" onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
