<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Расширения TorrStream</title>
    <meta name="description" content="Расширения TorrStream: как поставить, как написать своё, справочник API и примеры.">
    <meta name="theme-color" content="#080b14">
    <meta property="og:title" content="Расширения TorrStream">
    <meta property="og:description" content="Как поставить расширение и как написать своё: справочник API и примеры.">
    <meta property="og:type" content="website">
    <style>
        :root {
            --bg: #080b14;
            --panel: #111827;
            --line: #1e2740;
            --text: #eef2ff;
            --muted: #8b9ac0;
            --dim: #67759b;
            --accent: #ff8c00;
            --accent-soft: rgba(255, 140, 0, .14);
            --blue: #4a9eff;
            --blue-soft: rgba(74, 158, 255, .12);
            --radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: -20%;
            right: -20%;
            height: 70vh;
            background:
                radial-gradient(60% 60% at 25% 0%, rgba(255, 140, 0, .13), transparent 70%),
                radial-gradient(50% 60% at 80% 10%, rgba(74, 158, 255, .13), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 16px 64px;
        }

        .logo {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: .3px;
            color: var(--text);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .crumbs {
            margin-left: 8px;
            color: var(--dim);
            font-size: 14px;
        }

        .crumbs a {
            color: var(--muted);
            text-decoration: none;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            margin: 22px 0 0;
            border-bottom: 1px solid var(--line);
        }

        .tabs a {
            margin-right: 6px;
            padding: 10px 14px;
            border-radius: 10px 10px 0 0;
            color: var(--muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .tabs a.active {
            color: var(--text);
            background: var(--panel);
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        .doc {
            margin-top: 18px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 26px 26px 22px;
        }

        .doc h1 {
            font-size: clamp(26px, 5vw, 34px);
            line-height: 1.2;
            margin: 0 0 14px;
        }

        .doc h2 {
            font-size: 21px;
            margin: 30px 0 10px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .doc h3 {
            font-size: 16px;
            margin: 22px 0 8px;
            color: var(--accent);
        }

        .doc p {
            margin: 10px 0;
            font-size: 15px;
        }

        .doc ul,
        .doc ol {
            margin: 10px 0 10px 22px;
            font-size: 15px;
        }

        .doc li {
            margin: 5px 0;
        }

        .doc code {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: .88em;
            background: var(--blue-soft);
            color: #cfe3ff;
            border-radius: 6px;
            padding: 1px 6px;
        }

        .doc pre {
            margin: 12px 0;
            padding: 14px 16px;
            background: #0b1120;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow-x: auto;
        }

        .doc pre code {
            background: none;
            padding: 0;
            font-size: 13.5px;
            line-height: 1.55;
            color: #dbe6ff;
            white-space: pre;
        }

        .doc table {
            width: 100%;
            margin: 12px 0;
            border-collapse: collapse;
            font-size: 14px;
        }

        .doc th,
        .doc td {
            text-align: left;
            vertical-align: top;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
        }

        .doc th {
            color: var(--muted);
            font-weight: 600;
        }

        .doc a {
            color: var(--blue);
        }

        .table-wrap {
            overflow-x: auto;
        }

        .status {
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .wrap {
                padding-top: 28px;
            }

            .doc {
                padding: 18px 16px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a class="logo" href="https://cash94.github.io/msx/guide/guide.html">Torr<span>Stream</span></a>
        <span class="crumbs">/ <a href="../">Документация</a> / Расширения</span>
        <nav class="tabs" id="tabs">
            <a href="?page=readme" data-page="readme">Обзор</a>
            <a href="?page=api" data-page="api">Справочник API</a>
            <a href="?page=examples" data-page="examples">Примеры</a>
        </nav>
        <article class="doc" id="doc">
            <p class="status">Загружаю…</p>
        </article>
    </div>

    <script>
        // Страницы — markdown в этой же папке (README.md, api.md, examples.md):
        // правится только md, страница рисует его сама, как /changelog/.
        // Разбор свой, без библиотек: заголовки, абзацы, списки, таблицы,
        // блоки кода, `код`, **жирный**, [ссылки](…).
        (function () {
            var PAGES = { readme: 'README.md', api: 'api.md', examples: 'examples.md' };
            var doc = document.getElementById('doc');

            function esc(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function inline(s) {
                var codes = [];
                s = s.replace(/`([^`]+)`/g, function (m, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
                s = esc(s);
                s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
                s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, href) {
                    var ext = /^https?:/.test(href);
                    return '<a href="' + href.replace(/"/g, '&quot;') + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + text + '</a>';
                });
                return s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return '<code>' + esc(codes[+i]) + '</code>'; });
            }

            function cells(line) {
                return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); });
            }

            function render(md) {
                var lines = md.replace(/\r/g, '').split('\n');
                var html = '', para = [], list = null, i = 0;

                function flushPara() {
                    if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; }
                }
                function closeList() {
                    if (list) { html += '</' + list + '>'; list = null; }
                }
                function flush() { flushPara(); closeList(); }

                while (i < lines.length) {
                    var line = lines[i];
                    var fence = /^\s*```(\w*)\s*$/.exec(line);
                    if (fence) {
                        flush();
                        var indent = line.match(/^\s*/)[0].length, code = [];
                        i++;
                        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i].slice(Math.min(indent, lines[i].match(/^\s*/)[0].length))); i++; }
                        html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>';
                        i++;
                        continue;
                    }
                    var h = /^(#{1,3})\s+(.*)$/.exec(line);
                    if (h) { flush(); html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; i++; continue; }
                    if (/^\s*\|/.test(line) && lines[i + 1] && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
                        flush();
                        var head = cells(line);
                        html += '<div class="table-wrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
                        i += 2;
                        while (i < lines.length && /^\s*\|/.test(lines[i])) {
                            html += '<tr>' + cells(lines[i]).map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
                            i++;
                        }
                        html += '</tbody></table></div>';
                        continue;
                    }
                    var ul = /^\s*[-*]\s+(.*)$/.exec(line), ol = /^\s*\d+\.\s+(.*)$/.exec(line);
                    if (ul || ol) {
                        flushPara();
                        var kind = ul ? 'ul' : 'ol';
                        if (list !== kind) { closeList(); html += '<' + kind + '>'; list = kind; }
                        var text = (ul || ol)[1];
                        // Продолжение пункта — следующие строки с отступом
                        while (lines[i + 1] && /^\s{2,}\S/.test(lines[i + 1]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i + 1]) && !/^\s*```/.test(lines[i + 1])) {
                            text += ' ' + lines[i + 1].trim();
                            i++;
                        }
                        html += '<li>' + inline(text) + '</li>';
                        i++;
                        continue;
                    }
                    if (!line.trim()) { flush(); i++; continue; }
                    closeList();
                    para.push(line.trim());
                    i++;
                }
                flush();
                return html;
            }

            function pageName() {
                var m = /[?&]page=(\w+)/.exec(location.search);
                return m && PAGES[m[1]] ? m[1] : 'readme';
            }

            function show(name) {
                var tabs = document.querySelectorAll('#tabs a');
                for (var t = 0; t < tabs.length; t++) tabs[t].classList.toggle('active', tabs[t].getAttribute('data-page') === name);
                doc.innerHTML = '<p class="status">Загружаю…</p>';
                fetch(PAGES[name], { cache: 'no-cache' })
                    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
                    .then(function (md) {
                        doc.innerHTML = render(md);
                        var h1 = doc.querySelector('h1');
                        document.title = (h1 && name !== 'readme' ? h1.textContent + ' — ' : '') + 'Расширения TorrStream';
                    })
                    .catch(function () {
                        doc.innerHTML = '<p class="status">Не удалось загрузить страницу. Исходник: ' +
                            '<a href="https://github.com/cash94/cash94.github.io/tree/main/docs/extensions">docs/extensions на GitHub</a></p>';
                    });
            }

            // Переходы между страницами без перезагрузки — и вкладки, и ссылки ?page= в тексте
            document.addEventListener('click', function (e) {
                var a = e.target.closest ? e.target.closest('a') : null;
                if (!a) return;
                var m = /^\?page=(\w+)/.exec(a.getAttribute('href') || '');
                if (!m || !PAGES[m[1]]) return;
                e.preventDefault();
                history.pushState(null, '', '?page=' + m[1]);
                show(m[1]);
                window.scrollTo(0, 0);
            });
            window.addEventListener('popstate', function () { show(pageName()); });
            show(pageName());
        })();
    </script>
</body>

</html>
